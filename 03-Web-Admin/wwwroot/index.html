<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Coffee Shop Admin</title>
    <base href="/" />

    <!-- Favicon: hình cốc của logo nhóm trên đĩa nâu. Tăng ?v= khi đổi icon (trình duyệt cache favicon rất lâu) -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />

    <!-- Font Be Vietnam Pro (hỗ trợ đầy đủ dấu tiếng Việt). Mất mạng thì tự dùng Segoe UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />

    <!-- Tăng số ?v= mỗi khi sửa app.css để trình duyệt không dùng bản cũ trong cache -->
    <link rel="stylesheet" href="css/app.css?v=43" />
</head>

<body>
    <div id="app">
        <p style="padding:24px">Đang tải Coffee Shop...</p>
    </div>

    <div id="blazor-error-ui">
        Có lỗi xảy ra.
        <a href="." class="reload">Tải lại</a>
        <a class="dismiss">×</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Tăng số ?v= mỗi khi sửa app.js (giống app.css) -->
    <script src="js/app.js?v=3"></script>
</body>

</html>

openapi: 3.0.3
info:
  title: API Hệ thống đặt món thông minh - Quán cà phê
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Hệ thống
  - name: Xác thực
  - name: Người dùng
  - name: Danh mục & Kích thước
  - name: Món
  - name: Topping
  - name: Khuyến mãi
  - name: Đơn hàng
  - name: Kho
  - name: Báo cáo

paths:
  # ================================================================ HỆ THỐNG
  /health:
    get:
      tags: [Hệ thống]
      summary: Kiểm tra API và kết nối database
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: { status: ok, database: connected, time: '2026-11-07T23:30:00' }

  # ================================================================ XÁC THỰC
  /auth/dang-nhap:
    post:
      tags: [Xác thực]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DangNhapRequest' }
            example: { tenDangNhap: quanly, matKhau: 'QuanLy@123' }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DangNhapResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Tài khoản bị khóa (TrangThai = 0), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/toi:
    get:
      tags: [Xác thực]
      summary: Thông tin tài khoản đang đăng nhập
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguoiDung' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/doi-mat-khau:
    post:
      tags: [Xác thực]
      summary: Đổi mật khẩu của chính mình
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoiMatKhauRequest' }
            example: { matKhauCu: 'NhanVien@123', matKhauMoi: 'MatKhauMoi@1' }
      responses:
        '204': { description: Đã đổi }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================ NGƯỜI DÙNG
  /nguoi-dung:
    get:
      tags: [Người dùng]
      summary: Danh sách tài khoản
      parameters:
        - { name: vaiTro, in: query, schema: { $ref: '#/components/schemas/VaiTro' } }
        - { name: trangThai, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NguoiDung' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Người dùng]
      summary: Tạo tài khoản nhân viên — mật khẩu được băm BCrypt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NguoiDungTaoRequest' }
            example: { tenDangNhap: thungan2, matKhau: '123456', hoTen: 'Nguyễn Văn B', email: 'b@coffee.vn', vaiTro: NhanVien }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/NguoiDung' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /nguoi-dung/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Người dùng]
      summary: Chi tiết tài khoản
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguoiDung' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Người dùng]
      summary: Sửa thông tin / đổi vai trò / khóa tài khoản / đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NguoiDungCapNhatRequest' }
            example: { trangThai: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguoiDung' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================================================================ DANH MỤC & KÍCH THƯỚC
  /danh-muc:
    get:
      tags: [Danh mục & Kích thước]
      summary: Danh sách danh mục
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DanhMuc' } } } } }
    post:
      tags: [Danh mục & Kích thước]
      summary: Tạo danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DanhMucRequest' }
            example: { tenDanhMuc: 'Nước ép' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/DanhMuc' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /danh-muc/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Danh mục & Kích thước]
      summary: Chi tiết danh mục
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhMuc' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Danh mục & Kích thước]
      summary: Sửa danh mục
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DanhMucRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DanhMuc' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Danh mục & Kích thước]
      summary: Xóa danh mục — chỉ khi không còn món nào
      responses:
        '204': { description: Đã xóa }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /kich-thuoc:
    get:
      tags: [Danh mục & Kích thước]
      summary: Danh sách kích thước S/M/L
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KichThuoc' } } } } }
    post:
      tags: [Danh mục & Kích thước]
      summary: Thêm kích thước
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KichThuoc' }
            example: { maKichThuoc: XL, tenKichThuoc: 'Siêu lớn' }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/KichThuoc' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /kich-thuoc/{ma}:
    parameters:
      - { name: ma, in: path, required: true, schema: { type: string, maxLength: 10 }, example: L }
    put:
      tags: [Danh mục & Kích thước]
      summary: Sửa tên kích thước
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KichThuoc' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KichThuoc' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Danh mục & Kích thước]
      summary: Xóa kích thước — chỉ khi chưa món nào dùng
      responses:
        '204': { description: Đã xóa }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================================================================ MÓN
  /mon:
    get:
      tags: [Món]
      summary: Menu — giá từng size, giá sau khuyến mãi, còn bán được không
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: maDanhMuc, in: query, schema: { type: integer } }
        - { name: tuKhoa, in: query, schema: { type: string }, description: Tìm theo tên món }
        - { name: coTheBan, in: query, schema: { type: boolean }, description: 'true = chỉ món đang bán được (tablet nên dùng)' }
        - { name: dangKhuyenMai, in: query, schema: { type: boolean } }
        - { name: baoGomNgungBan, in: query, schema: { type: boolean, default: false } }
        - { name: sapXep, in: query, schema: { type: string, enum: [ten, gia_tang, gia_giam, ban_chay], default: ten } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Mon' } }
                  meta: { $ref: '#/components/schemas/PhanTrang' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Món]
      summary: Thêm món kèm bảng giá theo size — ghi TenMon + ChiTietMon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonTaoRequest' }
            example:
              maDanhMuc: 1
              tenMon: 'Cà phê muối'
              hinhAnh: '/images/ca-phe-muoi.jpg'
              kichThuoc:
                - { maKichThuoc: M, giaBan: 35000 }
                - { maKichThuoc: L, giaBan: 42000 }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/Mon' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mon/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Món]
      summary: Chi tiết món
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mon' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Món]
      summary: Sửa món / gắn khuyến mãi / ngừng bán
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonCapNhatRequest' }
            example: { tenMon: 'Cà phê muối Huế', maKhuyenMai: 2 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mon' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Món]
      summary: Ngừng kinh doanh món
      responses:
        '204': { description: Đã ngừng bán }
        '404': { $ref: '#/components/responses/NotFound' }

  /mon/{id}/con-hang:
    patch:
      tags: [Món]
      summary: Báo tạm hết / có hàng lại trong ngày (NhanVien, QuanLy)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConHangRequest' }
            example: { conHang: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mon' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /mon/{id}/kich-thuoc:
    put:
      tags: [Món]
      summary: Cập nhật bảng giá theo size
      description: Size có trong danh sách → thêm mới hoặc sửa giá. Size không gửi lên → `dangApDung = false` (không xóa vì đơn cũ tham chiếu).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/GiaSizeRequest' } }
            example: [{ maKichThuoc: S, giaBan: 26000 }, { maKichThuoc: M, giaBan: 30000 }, { maKichThuoc: L, giaBan: 36000 }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Mon' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /chi-tiet-mon/{maChiTietMon}/cong-thuc:
    parameters:
      - { name: maChiTietMon, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Món]
      summary: Định mức nguyên liệu của 1 món-size (NhanVien, QuanLy)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongThucDong' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Món]
      summary: Thay toàn bộ định mức của 1 món-size
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/CongThucDongRequest' } }
            example: [{ maNguyenLieu: 1, luongSuDung: 20 }, { maNguyenLieu: 2, luongSuDung: 30 }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongThucDong' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================ TOPPING
  /topping:
    get:
      tags: [Topping]
      summary: Danh sách topping
      security: []
      parameters:
        - { name: baoGomNgungBan, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Topping' } } } } }
    post:
      tags: [Topping]
      summary: Thêm topping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToppingRequest' }
            example: { tenTopping: 'Thạch cà phê', giaThem: 7000 }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/Topping' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /topping/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Topping]
      summary: Chi tiết topping
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Topping' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Topping]
      summary: Sửa topping
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ToppingRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Topping' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Topping]
      summary: Ngừng bán topping
      responses:
        '204': { description: Đã ngừng bán }
        '404': { $ref: '#/components/responses/NotFound' }

  /topping/{id}/con-hang:
    patch:
      tags: [Topping]
      summary: Báo topping tạm hết / có lại (NhanVien, QuanLy)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConHangRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Topping' } } } }

  /topping/{id}/cong-thuc:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Topping]
      summary: Định mức nguyên liệu của topping (NhanVien, QuanLy)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongThucDong' } } } } }
    put:
      tags: [Topping]
      summary: Thay toàn bộ định mức topping
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongThucDongRequest' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CongThucDong' } } } } }

  # ================================================================ KHUYẾN MÃI
  /khuyen-mai:
    get:
      tags: [Khuyến mãi]
      summary: Danh sách khuyến mãi
      security: []
      parameters:
        - { name: dangApDung, in: query, schema: { type: boolean }, description: 'true = đang hiệu lực ngay lúc này (tính cả giờ vàng)' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KhuyenMai' } } } } }
    post:
      tags: [Khuyến mãi]
      summary: Tạo khuyến mãi & gắn vào món
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KhuyenMaiRequest' }
            example:
              code: GIOVANG
              phanTramGiam: 20
              ngayBatDau: '2026-11-01T00:00:00'
              ngayKetThuc: '2026-12-31T23:59:59'
              gioBatDau: '14:00'
              gioKetThuc: '16:00'
              maTenMons: [4, 5]
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/KhuyenMai' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /khuyen-mai/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Khuyến mãi]
      summary: Chi tiết khuyến mãi
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KhuyenMai' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Khuyến mãi]
      summary: Sửa khuyến mãi — gửi maTenMons để thay danh sách món áp dụng
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KhuyenMaiRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KhuyenMai' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Khuyến mãi]
      summary: Xóa khuyến mãi — tự gỡ khỏi các món
      responses:
        '204': { description: Đã xóa }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================ ĐƠN HÀNG
  /don-hang:
    post:
      tags: [Đơn hàng]
      summary: Đặt món
      description: |
        Hệ thống tự động:
        1. Kiểm tra món còn bán (ConHang, NgungBan), size đang áp dụng, topping còn phục vụ.
        2. Áp khuyến mãi của món (kể cả giờ vàng) → lưu `donGiaBan` đã giảm.
        3. Kiểm tra đủ nguyên liệu theo CongThucMon (món + topping) → thiếu thì trả **422 HET_NGUYEN_LIEU**.
        4. Lưu snapshot `tenMonLuu` ("Tên món - Size"), `tenToppingLuu`, `donGiaTopping`.
        5. `tongTien = Σ (donGiaBan + Σ donGiaTopping) × soLuong`. Đơn ở trạng thái **PENDING** (chưa trừ kho).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatMonRequest' }
            example:
              phuongThucThanhToan: CASH
              chiTiet:
                - { maChiTietMon: 3, soLuong: 2, ghiChu: 'Ít đá', toppings: [3] }
                - { maChiTietMon: 9, soLuong: 1, toppings: [1, 2] }
      responses:
        '201': { description: Đã tạo đơn, content: { application/json: { schema: { $ref: '#/components/schemas/DonHang' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Món hết hàng / ngừng bán / thiếu nguyên liệu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: HET_NGUYEN_LIEU
                  message: Không đủ nguyên liệu để pha chế đơn này
                  details: [{ tenNguyenLieu: Bánh tiramisu, canDung: 5, conTon: 3, donViTinh: mieng }]
    get:
      tags: [Đơn hàng]
      summary: Danh sách đơn (NhanVien, QuanLy)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: trangThai, in: query, schema: { $ref: '#/components/schemas/TrangThaiThanhToan' } }
        - $ref: '#/components/parameters/TuNgay'
        - $ref: '#/components/parameters/DenNgay'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DonHang' } }
                  meta: { $ref: '#/components/schemas/PhanTrang' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /don-hang/{id}:
    get:
      tags: [Đơn hàng]
      summary: Chi tiết đơn (NhanVien, QuanLy)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DonHang' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /don-hang/{id}/thanh-toan:
    post:
      tags: [Đơn hàng]
      summary: Thanh toán (NhanVien, QuanLy) — gọi sp_ThanhToanVaTruKho
      description: |
        Cập nhật `phuongThucThanhToan`, sau đó `EXEC sp_ThanhToanVaTruKho @MaDonHang`:
        đơn → **PAID**, trừ NguyenLieu theo CongThucMon (món + topping), ghi LichSuKho `TieuHaoTheoDon`.
        Response kèm `canhBaoKho` = các nguyên liệu đang dưới mức cảnh báo sau khi trừ.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThanhToanRequest' }
            example: { phuongThucThanhToan: CASH, tienKhachDua: 200000 }
      responses:
        '200': { description: Đã thanh toán, content: { application/json: { schema: { $ref: '#/components/schemas/ThanhToanResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /don-hang/{id}/huy:
    post:
      tags: [Đơn hàng]
      summary: Hủy đơn — đơn đã PAID sẽ được ghi nhận hoàn tiền
      description: Ghi `lyDoHuy`, chuyển **CANCELLED**. Nếu đơn đã PAID → `daHoanTien = true`, `gioHoanTien = now`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HuyDonRequest' }
            example: { lyDoHuy: 'Khách đổi ý' }
      responses:
        '200': { description: Đã hủy, content: { application/json: { schema: { $ref: '#/components/schemas/DonHang' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================================================================ KHO
  /nguyen-lieu:
    get:
      tags: [Kho]
      summary: Tồn kho + dự báo số ngày còn dùng
      parameters:
        - { name: sapHet, in: query, schema: { type: boolean }, description: 'true = dưới mức cảnh báo hoặc còn ≤ 2 ngày dùng' }
        - { name: dangSuDung, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NguyenLieu' } } } } }
    post:
      tags: [Kho]
      summary: Thêm nguyên liệu — tồn ban đầu > 0 sẽ ghi LichSuKho NhapHang
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NguyenLieuRequest' }
            example: { tenNguyenLieu: 'Muối biển', donViTinh: gram, soLuongTon: 1000, mucCanhBaoToiThieu: 100 }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenLieu' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /nguyen-lieu/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Kho]
      summary: Chi tiết nguyên liệu
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenLieu' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Kho]
      summary: Sửa thông tin — không sửa tồn trực tiếp, dùng nhap-kho/xuat-huy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NguyenLieuCapNhatRequest' }
            example: { mucCanhBaoToiThieu: 800 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenLieu' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Kho]
      summary: Ngừng sử dụng nguyên liệu
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /nguyen-lieu/{id}/nhap-kho:
    post:
      tags: [Kho]
      summary: Nhập hàng — ghi LichSuKho 'NhapHang'
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiaoDichKhoRequest' }
            example: { soLuong: 2000, ghiChu: 'Nhập từ NCC Trung Nguyên' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenLieu' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /nguyen-lieu/{id}/xuat-huy:
    post:
      tags: [Kho]
      summary: Xuất hủy — ghi LichSuKho 'XuatHuy'
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiaoDichKhoRequest' }
            example: { soLuong: 500, ghiChu: 'Sữa hết hạn' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NguyenLieu' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /lich-su-kho:
    get:
      tags: [Kho]
      summary: Nhật ký kho
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: maNguyenLieu, in: query, schema: { type: integer } }
        - { name: loaiGiaoDich, in: query, schema: { type: string, enum: [NhapHang, XuatHuy, TieuHaoTheoDon] } }
        - $ref: '#/components/parameters/TuNgay'
        - $ref: '#/components/parameters/DenNgay'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LichSuKho' } }
                  meta: { $ref: '#/components/schemas/PhanTrang' }

  # ================================================================ BÁO CÁO
  /bao-cao/doanh-thu:
    get:
      tags: [Báo cáo]
      summary: Doanh thu — chỉ tính đơn PAID
      parameters: [{ $ref: '#/components/parameters/TuNgay' }, { $ref: '#/components/parameters/DenNgay' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BaoCaoDoanhThu' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bao-cao/mon-ban-chay:
    get:
      tags: [Báo cáo]
      summary: Món bán chạy
      parameters:
        - $ref: '#/components/parameters/TuNgay'
        - $ref: '#/components/parameters/DenNgay'
        - { name: soLuong, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    maTenMon: { type: integer }
                    tenMon: { type: string }
                    soLuong: { type: integer }
                    doanhThu: { type: number }

  /bao-cao/gio-cao-diem:
    get:
      tags: [Báo cáo]
      summary: Số đơn & doanh thu theo 24 giờ — xếp ca, chọn giờ vàng
      parameters: [{ $ref: '#/components/parameters/TuNgay' }, { $ref: '#/components/parameters/DenNgay' }]
      responses:
        '200':
          description: 24 phần tử
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    gio: { type: integer, minimum: 0, maximum: 23 }
                    soDon: { type: integer }
                    doanhThu: { type: number }

# ================================================================== COMPONENTS
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    TuNgay: { name: tuNgay, in: query, schema: { type: string, format: date-time }, example: '2026-11-01T00:00:00' }
    DenNgay: { name: denNgay, in: query, schema: { type: string, format: date-time }, example: '2026-11-30T23:59:59' }

  responses:
    BadRequest: { description: Dữ liệu không hợp lệ (VALIDATION_ERROR / BAD_REQUEST), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Chưa đăng nhập / token sai, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Không đủ quyền, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Không tìm thấy, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Xung đột trạng thái / trùng dữ liệu, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details: {}
    PhanTrang:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    VaiTro: { type: string, enum: [QuanLy, NhanVien] }
    TrangThaiThanhToan: { type: string, enum: [PENDING, PAID, CANCELLED] }
    PhuongThucThanhToan: { type: string, enum: [CASH, QR_TRANSFER] }

    # ---------------------------------------------------------- NguoiDung
    DangNhapRequest:
      type: object
      required: [tenDangNhap, matKhau]
      properties:
        tenDangNhap: { type: string, maxLength: 50 }
        matKhau: { type: string }
    DangNhapResponse:
      type: object
      properties:
        token: { type: string }
        hetHan: { type: string, format: date-time }
        nguoiDung: { $ref: '#/components/schemas/NguoiDung' }
    NguoiDung:
      type: object
      properties:
        maNguoiDung: { type: integer, example: 1 }
        tenDangNhap: { type: string, example: quanly }
        hoTen: { type: string, example: Chủ quán }
        email: { type: string, example: quanly@coffee.vn }
        vaiTro: { $ref: '#/components/schemas/VaiTro' }
        trangThai: { type: boolean, description: 'true = hoạt động, false = bị khóa' }
    DoiMatKhauRequest:
      type: object
      required: [matKhauCu, matKhauMoi]
      properties:
        matKhauCu: { type: string }
        matKhauMoi: { type: string, minLength: 6 }
    NguoiDungTaoRequest:
      type: object
      required: [tenDangNhap, matKhau, hoTen, email, vaiTro]
      properties:
        tenDangNhap: { type: string, pattern: '^[a-zA-Z0-9_.]{3,50}$' }
        matKhau: { type: string, minLength: 6 }
        hoTen: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 100 }
        vaiTro: { $ref: '#/components/schemas/VaiTro' }
    NguoiDungCapNhatRequest:
      type: object
      properties:
        hoTen: { type: string }
        email: { type: string, format: email }
        vaiTro: { $ref: '#/components/schemas/VaiTro' }
        trangThai: { type: boolean }
        matKhauMoi: { type: string, minLength: 6, description: Quản lý đặt lại mật khẩu }

    # ---------------------------------------------------------- DanhMuc, KichThuoc
    DanhMuc:
      type: object
      properties:
        maDanhMuc: { type: integer, example: 1 }
        tenDanhMuc: { type: string, example: Cà phê }
        soMon: { type: integer, description: Số món đang kinh doanh, example: 3 }
    DanhMucRequest:
      type: object
      required: [tenDanhMuc]
      properties:
        tenDanhMuc: { type: string, maxLength: 100 }
    KichThuoc:
      type: object
      required: [maKichThuoc, tenKichThuoc]
      properties:
        maKichThuoc: { type: string, maxLength: 10, example: M }
        tenKichThuoc: { type: string, example: Vừa }

    # ---------------------------------------------------------- Mon
    Mon:
      type: object
      properties:
        maTenMon: { type: integer, example: 1 }
        maDanhMuc: { type: integer, example: 1 }
        tenDanhMuc: { type: string, example: Cà phê }
        tenMon: { type: string, example: Bạc xỉu }
        hinhAnh: { type: string, nullable: true }
        conHang: { type: boolean, description: Cờ thủ công TenMon.ConHang }
        ngungBan: { type: boolean }
        coTheBan: { type: boolean, description: 'Tự tính: conHang && !ngungBan && có ít nhất 1 size đang áp dụng và đủ nguyên liệu' }
        khuyenMai:
          nullable: true
          type: object
          properties:
            maKhuyenMai: { type: integer }
            code: { type: string, example: KHAITRUONG10 }
            phanTramGiam: { type: number, example: 10 }
            dangApDung: { type: boolean }
            gioBatDau: { type: string, nullable: true, example: '14:00' }
            gioKetThuc: { type: string, nullable: true, example: '16:00' }
        kichThuoc:
          type: array
          items: { $ref: '#/components/schemas/GiaTheoSize' }
    GiaTheoSize:
      type: object
      properties:
        maChiTietMon: { type: integer, example: 7, description: Dùng mã này khi đặt món }
        maKichThuoc: { type: string, example: M }
        tenKichThuoc: { type: string, example: Vừa }
        giaBan: { type: number, example: 32000 }
        giaSauGiam: { type: number, example: 28800 }
        dangApDung: { type: boolean }
        duNguyenLieu: { type: boolean }
    GiaSizeRequest:
      type: object
      required: [maKichThuoc, giaBan]
      properties:
        maKichThuoc: { type: string }
        giaBan: { type: number, minimum: 0 }
        dangApDung: { type: boolean, default: true }
    MonTaoRequest:
      type: object
      required: [maDanhMuc, tenMon, kichThuoc]
      properties:
        maDanhMuc: { type: integer }
        tenMon: { type: string, maxLength: 150 }
        hinhAnh: { type: string, maxLength: 255 }
        maKhuyenMai: { type: integer, nullable: true }
        kichThuoc: { type: array, minItems: 1, items: { $ref: '#/components/schemas/GiaSizeRequest' } }
    MonCapNhatRequest:
      type: object
      properties:
        maDanhMuc: { type: integer }
        tenMon: { type: string }
        hinhAnh: { type: string }
        maKhuyenMai: { type: integer, description: '0 = gỡ khuyến mãi' }
        ngungBan: { type: boolean }
    ConHangRequest:
      type: object
      required: [conHang]
      properties:
        conHang: { type: boolean }

    # ---------------------------------------------------------- CongThuc
    CongThucDongRequest:
      type: object
      required: [maNguyenLieu, luongSuDung]
      properties:
        maNguyenLieu: { type: integer }
        luongSuDung: { type: number, minimum: 0.01 }
    CongThucDong:
      type: object
      properties:
        maCongThuc: { type: integer }
        maNguyenLieu: { type: integer }
        tenNguyenLieu: { type: string, example: Cà phê hạt }
        donViTinh: { type: string, example: gram }
        luongSuDung: { type: number, example: 20 }

    # ---------------------------------------------------------- Topping
    Topping:
      type: object
      properties:
        maTopping: { type: integer, example: 1 }
        tenTopping: { type: string, example: Trân châu đen }
        giaThem: { type: number, example: 5000 }
        conHang: { type: boolean }
        ngungBan: { type: boolean }
        duNguyenLieu: { type: boolean }
    ToppingRequest:
      type: object
      required: [tenTopping, giaThem]
      properties:
        tenTopping: { type: string, maxLength: 100 }
        giaThem: { type: number, minimum: 0 }
        conHang: { type: boolean, default: true }
        ngungBan: { type: boolean, default: false }

    # ---------------------------------------------------------- KhuyenMai
    KhuyenMai:
      type: object
      properties:
        maKhuyenMai: { type: integer }
        code: { type: string, example: GIOVANG20 }
        phanTramGiam: { type: number, example: 20 }
        ngayBatDau: { type: string, format: date-time }
        ngayKetThuc: { type: string, format: date-time }
        gioBatDau: { type: string, nullable: true, example: '14:00' }
        gioKetThuc: { type: string, nullable: true, example: '16:00' }
        dangApDung: { type: boolean, description: Có hiệu lực ngay lúc gọi API không }
        soMonApDung: { type: integer }
    KhuyenMaiRequest:
      type: object
      required: [code, phanTramGiam, ngayBatDau, ngayKetThuc]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{3,20}$' }
        phanTramGiam: { type: number, minimum: 0.01, maximum: 100 }
        ngayBatDau: { type: string, format: date-time }
        ngayKetThuc: { type: string, format: date-time }
        gioBatDau: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:mm — bỏ trống = cả ngày' }
        gioKetThuc: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        maTenMons: { type: array, items: { type: integer }, description: Danh sách món áp dụng (ghi TenMon.MaKhuyenMai) }

    # ---------------------------------------------------------- DonHang
    DatMonRequest:
      type: object
      required: [chiTiet]
      properties:
        phuongThucThanhToan: { $ref: '#/components/schemas/PhuongThucThanhToan' }
        chiTiet:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [maChiTietMon, soLuong]
            properties:
              maChiTietMon: { type: integer, description: 'Mã món-size lấy từ GET /mon → kichThuoc[].maChiTietMon' }
              soLuong: { type: integer, minimum: 1, maximum: 50 }
              ghiChu: { type: string, maxLength: 255 }
              toppings: { type: array, items: { type: integer }, description: 'Mã topping, mỗi loại tối đa 1 phần/ly' }
    DonHang:
      type: object
      properties:
        maDonHang: { type: integer, example: 15 }
        maNguoiDung: { type: integer, nullable: true, description: 'null = khách tự order trên tablet' }
        tenNhanVien: { type: string, nullable: true }
        tongTien: { type: number, example: 117000 }
        phuongThucThanhToan: { $ref: '#/components/schemas/PhuongThucThanhToan' }
        trangThaiThanhToan: { $ref: '#/components/schemas/TrangThaiThanhToan' }
        thoiGianTao: { type: string, format: date-time }
        lyDoHuy: { type: string, nullable: true }
        daHoanTien: { type: boolean }
        gioHoanTien: { type: string, format: date-time, nullable: true }
        chiTiet:
          type: array
          items:
            type: object
            properties:
              maChiTietDon: { type: integer }
              maChiTietMon: { type: integer }
              tenMonLuu: { type: string, example: Bạc xỉu - Lớn }
              donGiaBan: { type: number, example: 34200 }
              soLuong: { type: integer, example: 2 }
              ghiChu: { type: string, nullable: true }
              toppings:
                type: array
                items:
                  type: object
                  properties:
                    maTopping: { type: integer }
                    tenToppingLuu: { type: string, example: Thêm shot espresso }
                    donGiaTopping: { type: number, example: 10000 }
              thanhTien: { type: number, example: 88400, description: '(donGiaBan + Σ topping) × soLuong' }
    ThanhToanRequest:
      type: object
      required: [phuongThucThanhToan]
      properties:
        phuongThucThanhToan: { $ref: '#/components/schemas/PhuongThucThanhToan' }
        tienKhachDua: { type: number, minimum: 0, description: Để tính tiền thừa (tiền mặt) }
    ThanhToanResponse:
      type: object
      properties:
        donHang: { $ref: '#/components/schemas/DonHang' }
        tienThua: { type: number, example: 83000 }
        canhBaoKho:
          type: array
          items:
            type: object
            properties:
              maNguyenLieu: { type: integer }
              tenNguyenLieu: { type: string }
              soLuongTon: { type: number }
              mucCanhBaoToiThieu: { type: number }
              donViTinh: { type: string }
    HuyDonRequest:
      type: object
      required: [lyDoHuy]
      properties:
        lyDoHuy: { type: string, maxLength: 255 }

    # ---------------------------------------------------------- Kho
    NguyenLieu:
      type: object
      properties:
        maNguyenLieu: { type: integer }
        tenNguyenLieu: { type: string, example: Cà phê hạt }
        donViTinh: { type: string, example: gram }
        soLuongTon: { type: number, example: 4870 }
        mucCanhBaoToiThieu: { type: number, example: 500 }
        dangSuDung: { type: boolean }
        sapHet: { type: boolean, description: 'soLuongTon ≤ mức cảnh báo hoặc soNgayConLai ≤ 2' }
        tieuHaoTrungBinhNgay: { type: number, example: 650.5, description: Trung bình 7 ngày từ LichSuKho }
        soNgayConLai: { type: number, nullable: true, example: 7.5, description: 'Dự báo; null nếu chưa có dữ liệu tiêu hao' }
    NguyenLieuRequest:
      type: object
      required: [tenNguyenLieu, donViTinh]
      properties:
        tenNguyenLieu: { type: string, maxLength: 100 }
        donViTinh: { type: string, maxLength: 20 }
        soLuongTon: { type: number, minimum: 0, default: 0 }
        mucCanhBaoToiThieu: { type: number, minimum: 0, default: 10 }
        dangSuDung: { type: boolean, default: true }
    NguyenLieuCapNhatRequest:
      type: object
      properties:
        tenNguyenLieu: { type: string }
        donViTinh: { type: string }
        mucCanhBaoToiThieu: { type: number, minimum: 0 }
        dangSuDung: { type: boolean }
    GiaoDichKhoRequest:
      type: object
      required: [soLuong]
      properties:
        soLuong: { type: number, minimum: 0.01 }
        ghiChu: { type: string, maxLength: 255 }
    LichSuKho:
      type: object
      properties:
        maLichSu: { type: integer }
        maNguyenLieu: { type: integer }
        tenNguyenLieu: { type: string }
        maDonHang: { type: integer, nullable: true }
        maNguoiDung: { type: integer, nullable: true }
        loaiGiaoDich: { type: string, enum: [NhapHang, XuatHuy, TieuHaoTheoDon] }
        soLuongThayDoi: { type: number, example: -40 }
        thoiGian: { type: string, format: date-time }
        ghiChu: { type: string, nullable: true }

    # ---------------------------------------------------------- Báo cáo
    BaoCaoDoanhThu:
      type: object
      properties:
        tuNgay: { type: string, format: date-time, nullable: true }
        denNgay: { type: string, format: date-time, nullable: true }
        tongSoDon: { type: integer }
        soDonDaThanhToan: { type: integer }
        soDonChoThanhToan: { type: integer }
        soDonHuy: { type: integer }
        soDonHoanTien: { type: integer }
        doanhThu: { type: number }
        giaTriDonTrungBinh: { type: number }
        theoPhuongThuc: { type: object, additionalProperties: { type: number }, example: { CASH: 250000, QR_TRANSFER: 120000 } }
        theoNgay:
          type: array
          items:
            type: object
            properties:
              ngay: { type: string, format: date }
              soDon: { type: integer }
              doanhThu: { type: number }
